# Transitional Greater Sydney gauge-only smoke profile.
#
# This is not the production Component 01/02 configuration. It exists only to exercise
# the inherited gauge graph and model while the component packages are implemented.

dataset_parameters:
  gauge_folder: database/sydney_gauge_legacy
  start_year: 2022
  end_year: 2022
  include_lpe: true

filters:
  uptime_threshold: 0.9

training_params:
  fold_count: 5
  seed: 123
  batch_size: 128
  epochs: 100
  early_stop: 10
  weighted_loss_alpha: 0.18
  split_file: database/sydney_split_info.json

layer_connect:
  gauge_gauge: 5
  edge_normalisation: global

model:
  hidden_channels: 32
  num_layers: 5
  learning_rate: 0.0003
  weight_decay: 1e-4
  dropout: 0.15
