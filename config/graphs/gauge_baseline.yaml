k_neighbours: 5
distance: haversine_km        # or euclidean_degrees for the inherited comparison
edge_normalisation: per_node  # or global for the inherited comparison
# both_directions: every pick adds i -> j and j -> i, each weight scaled at its own
# receiving gauge, so no gauge is left receiving from nothing (ISS-25).
# false is the inherited one-direction-per-pick behaviour.
both_directions: true
include_lpe: true
lpe_dimensions: 4
# Per-node weights are directed because they are normalised by receiving node.
layer_is_directed: true

data_dir: database/standard
split_file: config/splits/sydney_5fold.json
output_dir: database/graphs/gauge_baseline
input_layers: [raingauge]
# Used only when radar or satellite is selected in input_layers.
layer_k_neighbours: 9
# D09.2: sensor -> gauge only; true explicitly restores gauge -> sensor edges.
reverse_cross_support: false
