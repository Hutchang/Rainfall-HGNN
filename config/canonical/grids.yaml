# Paths resolve from the repository root. Each input needs an ok index.csv row.
raw_dir: database/raw
output_dir: database/standard

# Study period the archive roots below are checked against, inclusive. Matches
# config/ingestion/sydney.yaml's period for the same region.
start: 2021-01-01
end: 2022-12-31

layers:
  radar:
    # Where the NCI archive lives (D13.1). `null` means "not checked yet": on
    # Gadi this is the mounted rq0 project directory; locally it can point at a
    # sample tree such as tests/data/ingestion/radar/. Read in place, never
    # downloaded -- see docs/grids/README.md, "Where the data is".
    #
    # Path confirmed by browsing the public THREDDS catalog (mirrors the Gadi
    # mount 1:1 for this archive) on 2026-09-26; not yet verified against an
    # actual Gadi shell -- see docs/grids/RADAR_SOURCE.md. Only exists on Gadi
    # with project rq0 membership; --check-inputs names that if it's missing.
    root: /g/data/rq0/rainfields3

    # D13.2: subsample the native 512x512, 0.5 km grid to the cell nearest
    # each point of a stride*0.5 km grid -- stride 10 gives ~5 km spacing,
    # matching the paper's radar spacing (sec 4.1), and ~2,700 nodes for one
    # site's extent. A scientific choice, not an incidental default; see
    # docs/grids/README.md.
    subsample_stride: 10

    # Declared from the archive files themselves (D13.2), not assumed:
    # title="Merged Gauge/Radar Accumulation (15 min)" and the presence of
    # contributing_gauges are read directly off the NetCDF global attributes.
    product: prcp-m15
    units: mm accumulated per hour (native files are mm per 15-minute window; summed here)
    timestamp_convention: hour beginning, UTC
    gauge_correction: "yes -- see each file's contributing_gauges attribute"
    evidence: confirmed against tests/data/ingestion/radar/71_20220103.prcp-m15.zip and the fetcher's earlier work; see docs/grids/RADAR_SOURCE.md
  satellite:
    # See radar.root above. Project, layout and access are all TO CONFIRM
    # (ISS-03) -- likely NCI project rv74, Himawari CRRPH.
    root: null
    data_file: satellite/satellite_2022_preprocessed.pkl
    coordinates_file: satellite/satellite_node_coords.csv
    product: UNKNOWN
    units: UNKNOWN
    timestamp_convention: UNKNOWN
    gauge_correction: UNKNOWN
    evidence: TO CONFIRM; satellite coordinates must be supplied in source array order
