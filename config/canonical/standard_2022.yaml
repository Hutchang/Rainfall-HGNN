# 2022 only, as the paper's Sydney testbed (sec 4.1). Identical to config/canonical/standard.yaml except
# for output_dir and period.
# Component 02 settings: build the standard tables from Component 01's raw files.
# Everything that decides what enters the standard dataset lives here, not in Python.

raw_dir: database/raw
output_dir: database/standard_2022
period: {start: 2022-01-01, end: 2022-12-31}
ingestion_config: config/ingestion/sydney.yaml   # for the bounding box in figures
# database/raw holds a national fetch (ISS-11). Build only stations inside the
# ingestion config's gauge bounds. Set false for an all-stations (Australia-wide) build.
restrict_to_bounds: true

# Station-level rules (requirements doc 02, "The three rules that carry the science")
min_coverage: 0.90        # fraction of the period's hours a station needs to be usable
dead_gauge_days: 90       # consecutive verified-dry days that make a gauge suspect
dead_gauge_radius_km: 50  # ...while at least this many neighbours within this radius saw rain
dead_gauge_neighbours: 3
colocated_m: 100          # stations closer than this are flagged colocated_with (kept; Component 03 decides)

# Millimetres per tip is inferred per station as the smallest positive counted record
# (BoM's series metadata does not carry it). This is the fallback tolerance for a
# station that recorded no positive tip in the whole period, so there is nothing to
# infer from. 0.5 mm is the increment observed at 144 of 152 active Sydney stations,
# not a guaranteed constant, which is why it lives here and not in verify.py.
default_tip_increment_mm: 0.5

# Physical plausibility. BoM's daily total is computed from the same tips, so a
# malfunctioning gauge can pass the daily check. Each cap rejects the whole day.
# Sydney's 24 h record is about 330 mm; Australia's hourly record is about 200 mm.
plausibility:
  max_record_mm: 2.0    # a single record above this is not a tip: the series is not tip-resolution that day
  max_hourly_mm: 150    # more than this in one hour is a tip burst, not rain
  max_daily_mm: 400     # more than this in one rain day is a malfunction, whatever BoM's total says

# BoM quality codes (from the KiWIS getQualityCodes request, 2026-09-05; see
# docs/canonical/README.md). Codes are BoM's opinion of a record; the daily-total
# check is the arbiter for a day. Codes only decide which records are counted at all.
quality:
  tips:
    count: [10, 110, 140]   # A best, C estimate, E unknown: counted, then verified daily
    ignore: [210]           # F missing or incorrect: never counted
    gap: [-1]               # undocumented, always a null value: BoM marking a hole
  daily:
    trusted: [10, 110, 140] # a total we compare against
    dry: [130]              # BoM "No rainfall": verified total of 0.0
    unverifiable: [-1, 210, 254]  # null, missing/incorrect, undocumented: no hours written
