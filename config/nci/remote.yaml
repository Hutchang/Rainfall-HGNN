# Settings for scripts/nci/remote.py. Your NCI username is not stored here: put it in
# ~/.ssh/config (see docs/nci/ONBOARDING.md) so `ssh gadi.nci.org.au` logs in without
# a password prompt.
project: no50
login_host: gadi.nci.org.au      # commands and job submission
transfer_host: gadi-dm.nci.org.au  # uploads and downloads (NCI's data movers)
# BatchMode makes a missing key fail at once instead of waiting for a password.
ssh: [ssh, -o, BatchMode=yes]

# {project} and {user} are filled in; {user} is your NCI username as Gadi reports it.
scratch_root: /scratch/{project}/{user}/rainflow  # your code checkout and run folders
# Shared by the project: environments (scripts/nci/prepare_environment.pbs) and
# published tables (scripts/nci/publish_tables.pbs, listed in config/nci/datasets.yaml).
shared_root: /g/data/{project}/rainflow
# Graphs built by runs, shared by the project and named by everything that decides
# them. Scratch removes files nobody has read for 100 days; a run rebuilds what is gone.
graph_cache: /scratch/{project}/rainflow/graphs

# One fold per job. Charge rates are NCI's published ones (docs/nci/README.md);
# gpuvolta's was confirmed by job 181507760 (12 CPUs, 5.3 minutes, 3.18 SU).
queues:
  gpuvolta:  # V100 32 GB, the larger GPU pool
    ncpus: 12
    ngpus: 1
    mem: 90GB
    jobfs: 10GB
    su_per_cpu_hour: 3.0
    device: cuda
    max_walltime: "48:00:00"
  dgxa100:  # A100 80 GB
    ncpus: 16
    ngpus: 1
    mem: 128GB
    jobfs: 10GB
    su_per_cpu_hour: 4.5
    device: cuda
    max_walltime: "48:00:00"
  normal:  # CPU only; chosen only when asked for
    ncpus: 16
    ngpus: 0
    mem: 64GB
    jobfs: 10GB
    su_per_cpu_hour: 2.0
    device: cpu
    max_walltime: "48:00:00"

# Builds a missing graph set into graph_cache before the folds start.
graph_job:
  queue: normal
  ncpus: 24
  mem: 96GB
  jobfs: 1GB
  walltime: "01:00:00"
  su_per_cpu_hour: 2.0
# Joins the five folds and scores every method once they have all finished.
score_job:
  queue: normal
  ncpus: 8
  mem: 64GB
  jobfs: 1GB
  walltime: "01:00:00"
  su_per_cpu_hour: 2.0

# Seconds per epoch for every 1,000 hours of data, by queue and input layers, from
# finished Gadi jobs (docs/nci/README.md). A fold's walltime is epochs x this x hours
# / 1000, times walltime_margin, plus 15 minutes, rounded up to a quarter hour.
# Measured: dgxa100 G (jobs 181499204-08) and G+R (181499210-14); gpuvolta G+R
# (181509853); normal G (181355855-57), G+R (181416787-95) and G+R+S (181416788-96).
# The rest are scaled from those by the measured gpuvolta/dgxa100 and G+R+S/G+R
# ratios.
epoch_seconds_per_1000_hours:
  dgxa100:
    raingauge: 4.4
    raingauge+radar: 14.2
    raingauge+radar+satellite: 15.9
  gpuvolta:
    raingauge: 7.5
    raingauge+radar: 24.2
    raingauge+radar+satellite: 27.1
  normal:
    raingauge: 21.9
    raingauge+radar: 31.6
    raingauge+radar+satellite: 35.3
walltime_margin: 1.3

poll_seconds: 300
