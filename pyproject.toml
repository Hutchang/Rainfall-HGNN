[project]
name = "comp3888-m17-01-p23"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "geopandas==1.1.4",
    "httpx>=0.27,<1",
    "matplotlib==3.11.1",
    "netcdf4==1.7.4",
    "networkx==3.6.1",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pyarrow>=18,<23",
    "pydantic>=2,<3",
    "pyproj>=3.7.2",
    "pyyaml==6.0.3",
    "rasterio==1.5.1",
    "scikit-learn==1.9.0",
    "scipy==1.18.1",
    "shapely==2.1.2",
    "textual>=6,<7",
    "torch==2.13.0",
    "torch-geometric==2.8.0.post1",
    "tqdm==4.70.0",
    "xarray==2026.7.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov>=7.1.0",
    "ruff==0.16.5",
    "scikit-learn-stubs>=0.0.3",
]

# Linux takes torch's CUDA 12.6 build, which runs on Gadi's V100s (gpuvolta, sm_70) and
# A100s (dgxa100, sm_80) alike, so one environment serves every Gadi queue. PyPI's
# default Linux build is CUDA 13, which dropped Volta. macOS and Windows keep PyPI's
# build.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (bug prevention)
    "UP",  # pyupgrade (syntax modernization)
    "N",   # pep8-naming
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.mccabe]
max-complexity = 10 # Flags functions that are getting too deeply nested or complex
